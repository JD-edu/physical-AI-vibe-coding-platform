<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine 클론 (오류 수정 완료 버전)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #333; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 950px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        video {
            width: 100%;
            max-width: 360px;
            border-radius: 8px;
            transform: scaleX(-1);
            background-color: #000;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 16px;
            margin: 5px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background-color: #45a049; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-train { background-color: #9c27b0; font-weight: bold; }
        .btn-train:hover { background-color: #7b1fa2; }
        .btn-serial { background-color: #008CBA; }
        .btn-class { background-color: #ff9800; }
        .status-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background-color: #eef2f5;
            font-weight: bold;
        }
        #result-display {
            font-size: 24px;
            color: #2196F3;
            margin-top: 10px;
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 12px;
            background-color: #9c27b0;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

    <h1>🤖 Teachable Machine (MLP / FC Layer 방식)</h1>

    <div class="container">
        <div class="card">
            <h3>1. 데이터 수집</h3>
            <video id="webcam" autoplay playsinline muted></video>
            <div style="margin-top: 10px;">
                <button class="btn btn-class" id="btn-add-a">클래스 A 수집 (0개)</button>
                <button class="btn btn-class" id="btn-add-b">클래스 B 수집 (0개)</button>
            </div>
        </div>

        <div class="card" style="min-width: 320px;">
            <h3>2. 신경망(MLP) 학습 & 추론</h3>
            <button class="btn btn-train" id="btn-train-model" style="width: 90%;">🚀 MLP 모델 학습하기</button>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div id="train-status" style="font-size: 13px; color: #666; margin-top: 5px;">데이터를 수집한 뒤 학습 버튼을 누르세요.</div>

            <hr style="margin: 20px 0; border: 0.5px solid #eee;">

            <button class="btn btn-serial" id="btn-connect-serial">마이크로비트/ESP32 연결</button>
            <div class="status-box" id="serial-status">연결 상태: 미연결</div>

            <div id="result-display">학습 대기 중...</div>
            <div id="confidence-display" style="font-size: 14px; color: #666; margin-top: 5px;">신뢰도: 0%</div>
        </div>
    </div>

    <script>
        let webcamElement = document.getElementById('webcam');
        let mobilenetModel;
        let customMlpModel;
        
        let trainXs = [];
        let trainYs = [];
        let countA = 0;
        let countB = 0;

        let isPredicting = false;
        let isTrained = false;

        let port;
        let writer;

        // 1. TF 백엔드 준비 후 모델 및 웹캠 로드 (백엔드 에러 방지 핵심)
        async function init() {
            document.getElementById('result-display').innerText = "TF 백엔드 및 모델 초기화 중...";
            
            // TensorFlow.js 엔진 준비 대기
            await tf.ready();

            // 사전 학습된 MobileNet 로드
            mobilenetModel = await mobilenet.load();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcamElement.srcObject = stream;
                document.getElementById('result-display').innerText = "데이터 수집 후 학습하세요";
            } catch (error) {
                alert("웹캠을 활성화할 수 없습니다.");
                console.error(error);
            }
        }

        // 2. 샘플 데이터 수집 (안전한 텐서 메모리 추출 방식)
        function addExample(classId) {
            if (!mobilenetModel) return;

            // tf.tidy 내에서 return을 통해 생성된 텐서만 외부로 반환
            const featureTensor = tf.tidy(() => {
                const logits = mobilenetModel.infer(webcamElement, true);
                return logits.clone(); // 백엔드 자동 삭제 방지를 위해 clone
            });

            trainXs.push(featureTensor);
            trainYs.push(classId);

            if (classId === 0) {
                countA++;
                document.getElementById('btn-add-a').innerText = `클래스 A 수집 (${countA}개)`;
            } else if (classId === 1) {
                countB++;
                document.getElementById('btn-add-b').innerText = `클래스 B 수집 (${countB}개)`;
            }
        }

        // 3. MLP 신경망 모델 구축 및 학습
        async function trainMlpModel() {
            if (trainXs.length === 0) {
                alert("클래스 A와 B 데이터를 먼저 수집해 주세요!");
                return;
            }

            document.getElementById('btn-train-model').disabled = true;
            document.getElementById('train-status').innerText = "신경망 학습 시작...";

            // 수집된 텐서 연결 및 원-핫 인코딩
            const xDataset = tf.concat(trainXs);
            const yDataset = tf.oneHot(tf.tensor1d(trainYs, 'int32'), 2);

            // MLP 모델 구축
            customMlpModel = tf.sequential();
            customMlpModel.add(tf.layers.dense({
                units: 100,
                activation: 'relu',
                inputShape: [xDataset.shape[1]]
            }));
            customMlpModel.add(tf.layers.dense({
                units: 2,
                activation: 'softmax'
            }));

            customMlpModel.compile({
                optimizer: tf.train.adam(0.0001),
                loss: 'categoricalCrossentropy',
                metrics: ['accuracy']
            });

            const epochs = 20;
            await customMlpModel.fit(xDataset, yDataset, {
                epochs: epochs,
                callbacks: {
                    onEpochEnd: async (epoch, logs) => {
                        const progress = Math.round(((epoch + 1) / epochs) * 100);
                        document.getElementById('progress-fill').style.width = `${progress}%`;
                        document.getElementById('train-status').innerText = 
                            `학습 중... Epoch ${epoch + 1}/${epochs} (Loss: ${logs.loss.toFixed(4)})`;
                        await tf.nextFrame(); // UI 렌더링 스레드 확보
                    }
                }
            });

            // 데이터셋 메모리 해제
            xDataset.dispose();
            yDataset.dispose();

            document.getElementById('train-status').innerText = "학습 완료! 실시간 추론 중...";
            isTrained = true;

            if (!isPredicting) {
                isPredicting = true;
                predictLoop();
            }
        }

        // 4. 실시간 추론 루프
        async function predictLoop() {
            while (isPredicting) {
                if (isTrained && customMlpModel) {
                    let predictedClass = -1;
                    let confidence = 0;

                    tf.tidy(() => {
                        const featureVector = mobilenetModel.infer(webcamElement, true);
                        const prediction = customMlpModel.predict(featureVector);
                        const probabilities = prediction.dataSync();

                        const classA_prob = probabilities[0];
                        const classB_prob = probabilities[1];

                        predictedClass = classA_prob > classB_prob ? 0 : 1;
                        confidence = Math.round(Math.max(classA_prob, classB_prob) * 100);
                    });

                    if (predictedClass !== -1) {
                        const labels = ['클래스 A', '클래스 B'];
                        document.getElementById('result-display').innerText = labels[predictedClass];
                        document.getElementById('confidence-display').innerText = `신뢰도: ${confidence}%`;

                        if (confidence > 70) {
                            if (predictedClass === 0) sendSerialSignal('A');
                            else if (predictedClass === 1) sendSerialSignal('B');
                        }
                    }
                }
                
                await tf.nextFrame();
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }

        // 5. Web Serial API
        async function toggleSerialConnection() {
            if (port) {
                if (writer) writer.releaseLock();
                await port.close();
                port = null;
                writer = null;
                document.getElementById('serial-status').innerText = "연결 상태: 미연결";
                document.getElementById('btn-connect-serial').innerText = "마이크로비트/ESP32 연결";
                document.getElementById('serial-status').style.color = "black";
            } else {
                try {
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                    
                    const textEncoder = new TextEncoderStream();
                    textEncoder.readable.pipeTo(port.writable);
                    writer = textEncoder.writable.getWriter();

                    document.getElementById('serial-status').innerText = "연결 상태: 연결됨";
                    document.getElementById('btn-connect-serial').innerText = "연결 해제";
                    document.getElementById('serial-status').style.color = "green";
                } catch (err) {
                    console.error("시리얼 연결 실패:", err);
                }
            }
        }

        async function sendSerialSignal(charSignal) {
            if (writer) {
                try {
                    await writer.write(charSignal + "\n");
                } catch (err) {
                    console.error("시리얼 송신 에러:", err);
                }
            }
        }

        document.getElementById('btn-add-a').addEventListener('click', () => addExample(0));
        document.getElementById('btn-add-b').addEventListener('click', () => addExample(1));
        document.getElementById('btn-train-model').addEventListener('click', trainMlpModel);
        document.getElementById('btn-connect-serial').addEventListener('click', toggleSerialConnection);

        init();
    </script>
</body>
</html>
