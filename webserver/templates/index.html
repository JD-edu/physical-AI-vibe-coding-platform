<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피지컬 AI Teachable Machine 템플릿</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #333; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            transform: scaleX(-1); /* 좌우 반전 */
            background-color: #000;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 18px;
            margin: 5px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background-color: #45a049; }
        .btn-serial { background-color: #008CBA; }
        .btn-serial:hover { background-color: #007399; }
        .btn-class { background-color: #ff9800; }
        .btn-class:hover { background-color: #e68a00; }
        .status-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background-color: #eef2f5;
            font-weight: bold;
        }
        #result-display {
            font-size: 24px;
            color: #2196F3;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🤖 Teachable Machine x 피지컬 AI 템플릿</h1>

    <div class="container">
        <div class="card">
            <h3>1. 웹캠 & 데이터 학습</h3>
            <video id="webcam" autoplay playsinline muted></video>
            <div style="margin-top: 10px;">
                <button class="btn btn-class" id="btn-add-a">클래스 A 수집 (0개)</button>
                <button class="btn btn-class" id="btn-add-b">클래스 B 수집 (0개)</button>
            </div>
        </div>

        <div class="card" style="min-width: 300px;">
            <h3>2. 교구 연결 & AI 추론</h3>
            <button class="btn btn-serial" id="btn-connect-serial">마이크로비트/ESP32 연결</button>
            <div class="status-box" id="serial-status">연결 상태: 미연결</div>
            
            <hr style="margin: 20px 0; border: 0.5px solid #eee;">
            
            <h4>현재 감지된 결과</h4>
            <div id="result-display">대기 중...</div>
            <div id="confidence-display" style="font-size: 14px; color: #666; margin-top: 5px;">신뢰도: 0%</div>
        </div>
    </div>

    <script>
        // 변수 선언
        let webcamElement = document.getElementById('webcam');
        let classifier;
        let mobilenetModel;
        let isPredicting = false;
        
        let countA = 0;
        let countB = 0;

        // Web Serial API 관련 변수
        let port;
        let writer;

        // 1. 모델 및 웹캠 초기화
        async function init() {
            document.getElementById('result-display').innerText = "AI 모델 로딩 중...";
            
            // KNN Classifier 및 MobileNet 로드
            classifier = knnClassifier.create();
            mobilenetModel = await mobilenet.load();

            // 웹캠 권한 요청 및 연결
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcamElement.srcObject = stream;
                document.getElementById('result-display').innerText = "학습 버튼을 눌러주세요";
            } catch (error) {
                alert("웹캠에 접근할 수 없습니다. 권한을 확인해주세요.");
                console.error(error);
            }
        }

        // 2. 클래스별 데이터 수집 함수
        function addExample(classId) {
            if (!mobilenetModel) return;

            // 웹캠 이미지를 MobileNet Tensor로 변환 후 KNN 분류기에 추가
            const logits = mobilenetModel.infer(webcamElement, 'conv_preds');
            classifier.addExample(logits, classId);

            if (classId === 0) {
                countA++;
                document.getElementById('btn-add-a').innerText = `클래스 A 수집 (${countA}개)`;
            } else if (classId === 1) {
                countB++;
                document.getElementById('btn-add-b').innerText = `클래스 B 수집 (${countB}개)`;
            }

            // 데이터가 입력되면 실시간 추론 시작
            if (!isPredicting) {
                isPredicting = true;
                predictLoop();
            }
        }

        // 3. 실시간 추론 루프
        async function predictLoop() {
            while (isPredicting) {
                if (classifier.getNumClasses() > 0) {
                    const logits = mobilenetModel.infer(webcamElement, 'conv_preds');
                    const result = await classifier.predictClass(logits);

                    const classes = ['클래스 A', '클래스 B'];
                    const label = classes[result.label];
                    const confidence = Math.round(result.confidences[result.label] * 100);

                    document.getElementById('result-display').innerText = label;
                    document.getElementById('confidence-display').innerText = `신뢰도: ${confidence}%`;

                    // 신뢰도가 70% 이상일 때만 시리얼 신호 전송
                    if (confidence > 70) {
                        if (result.label == 0) {
                            sendSerialSignal('A');
                        } else if (result.label == 1) {
                            sendSerialSignal('B');
                        }
                    }
                }
                // 브라우저 과부하 방지를 위해 200ms 주기로 대기
                await tf.nextFrame();
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }

        // 4. Web Serial API 제어 함수
        async function toggleSerialConnection() {
            if (port) {
                // 연결 해제
                if (writer) writer.releaseLock();
                await port.close();
                port = null;
                writer = null;
                document.getElementById('serial-status').innerText = "연결 상태: 미연결";
                document.getElementById('btn-connect-serial').innerText = "마이크로비트/ESP32 연결";
                document.getElementById('serial-status').style.color = "black";
            } else {
                // 시리얼 연결 요청
                try {
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 }); // ESP32/micro:bit 통신 속도
                    
                    const textEncoder = new TextEncoderStream();
                    textEncoder.readable.pipeTo(port.writable);
                    writer = textEncoder.writable.getWriter();

                    document.getElementById('serial-status').innerText = "연결 상태: 연결됨";
                    document.getElementById('btn-connect-serial').innerText = "연결 해제";
                    document.getElementById('serial-status').style.color = "green";
                } catch (err) {
                    console.error("시리얼 연결 실패:", err);
                    alert("시리얼 포트 연결에 실패했거나 취소되었습니다.");
                }
            }
        }

        // 5. 시리얼 데이터 송신 함수 ('A' 또는 'B' 송신)
        async function sendSerialSignal(charSignal) {
            if (writer) {
                try {
                    await writer.write(charSignal + "\n");
                    console.log(`시리얼 전송 성공: ${charSignal}`);
                } catch (err) {
                    console.error("시리얼 송신 에러:", err);
                }
            }
        }

        // Event Listener 바인딩
        document.getElementById('btn-add-a').addEventListener('click', () => addExample(0));
        document.getElementById('btn-add-b').addEventListener('click', () => addExample(1));
        document.getElementById('btn-connect-serial').addEventListener('click', toggleSerialConnection);

        // 페이지 로드 시 실행
        init();
    </script>
</body>
</html>
